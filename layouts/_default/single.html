{{ define "main" }}
<style>
  body { background-color: #f2f4ee !important; color: #2e4732 !important; }
  a { color: #2e4732 !important; }
</style>
<article>
  <header>
    <h1>{{ .Title }}</h1>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan, 2006" }}</time>
  </header>
  <div class="content">
    {{ .Content }}
  </div>
  {{ with .Params.tags }}
    <div style="margin-top: 2rem;">
      {{ range . }}
        <a href="{{ "/tags/" | relLangURL }}{{ . | urlize }}/" style="margin-right: 8px;">#{{ . }}</a>
      {{ end }}
    </div>
  {{ end }}
</article>
{{ end }}
