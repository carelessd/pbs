{{ define "main" }}
<style>
  body { background-color: #f2f4ee !important; color: #2e4732 !important; }
  h1, h2, h3, h4, h5, h6, p, li, span, time { color: #2e4732 !important; }
  a { color: #2e4732 !important; text-decoration: underline; }
  hr { border-color: #d0d8c5; }
  pre, code { background-color: #e3e8da !important; color: #2e4732 !important; }
  
  header.global-header a, .site-title, nav a {
    font-size: 2.2rem !important;
    font-weight: bold !important;
  }
</style>
<article>
  <header style="margin-bottom: 2rem;">
    <div style="font-size: 2.2rem; font-weight: bold; margin-bottom: 1.5rem;">
      <a href="{{ "/" | relLangURL }}" style="text-decoration: none;">{{ .Site.Title }}</a>
    </div>
    <h1 style="font-size: 1.6rem; margin-bottom: 0.5rem; font-weight: normal;">{{ .Title }}</h1>
    <!-- 改为 Month Day, Year 格式 -->
    <time datetime="{{ .Date.Format "2006-01-02" }}" style="color: #5a7a5e !important; font-size: 0.9rem;">{{ .Date.Format "Jan 02, 2006" }}</time>
  </header>
  
  <div class="content" style="line-height: 1.7;">
    {{ .Content }}
  </div>

  {{ with .Params.tags }}
    <div style="margin-top: 3rem; padding-top: 1rem; border-top: 1px solid #d0d8c5;">
      {{ range . }}
        <a href="{{ "/tags/" | relLangURL }}{{ . | urlize }}/" style="margin-right: 10px; text-decoration: none;">#{{ . }}</a>
      {{ end }}
    </div>
  {{ end }}
</article>
{{ end }}
