布莱克说，刹那即永恒
你笑着说，何必要永恒？
光谷广场，爱交错纵横
那一刻，分不清
是你温柔的呼吸，还是
甜蜜的爱意
光谷地铁在你眼里
缓缓驶离
你说，没什么永恒
风再起时，樱花树下
静静的陪伴即永恒
那一刻，分不清
在光谷广场，你是世界
抑或世界是你？" />
