  <p>中国用户不愿意付费，投资人急着变现，开发者马上会想收费，这是无解的逻辑闭环。</p>
<p>于是适合中国国情的方式就出现，毫无底线的出卖隐私以获取免费服务的方式，以及接受被无限弹窗广告轰炸。</p>
<p>有种感觉，国内的开发者环境就跟国内的健身房一样。</p>
